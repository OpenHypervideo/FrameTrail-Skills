name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # On a branch by hand, e.g. one Update opened a pull request from (its own pushes do not start workflows)
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The vendored files against the lock, the plugin, the text written for Claude; no FrameTrail checkout, no dependencies
      - name: Run tests
        run: node --test-reporter=spec tests/run.mjs
