{
    "schema_version": "1.0",
    "name": "page-new-project",
    "description": "A new project file with a hypervideo of a video file and two chapters.",
    "tags": [
        "new",
        "page"
    ],
    "plugins": [
        "../../plugin"
    ],
    "context": {
        "scaffold_script": "scaffold.sh"
    },
    "execution": {
        "prompt": "I'm Ada. Make a FrameTrail project file trip.html here with a hypervideo called \"Field trip\" of ./field-trip.mp4, with the chapters \"Start\" at 0:00 and \"Arrival\" at 0:05.",
        "max_turns": 30,
        "timeout_seconds": 600,
        "allowed_tools": [
            "Read",
            "Glob",
            "Grep",
            "Edit",
            "Write",
            "Bash",
            "Skill"
        ]
    },
    "runs": 2,
    "graders": [
        {
            "type": "tool_used",
            "name": "skill-fired",
            "tool": "Skill",
            "input_match": "frametrail-hypervideo",
            "arm": "with-only"
        }
    ]
}
