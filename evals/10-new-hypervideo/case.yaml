{
    "schema_version": "1.0",
    "name": "new-hypervideo",
    "description": "A new hypervideo from a video file: the file in the library, the hypervideo playing it.",
    "tags": [
        "core",
        "new"
    ],
    "plugins": [
        "../../plugin"
    ],
    "context": {
        "scaffold_script": "scaffold.sh"
    },
    "execution": {
        "prompt": "I'm Ada. Make a new hypervideo called \"Field recording\" from ./field-recording.mp4.",
        "max_turns": 30,
        "timeout_seconds": 600,
        "allowed_tools": [
            "Read",
            "Glob",
            "Grep",
            "Edit",
            "Write",
            "Bash",
            "Skill"
        ]
    },
    "runs": 2,
    "graders": [
        {
            "type": "tool_used",
            "name": "skill-fired",
            "tool": "Skill",
            "input_match": "frametrail-hypervideo",
            "arm": "with-only"
        }
    ]
}
