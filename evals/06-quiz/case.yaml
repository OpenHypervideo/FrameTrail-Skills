{
    "schema_version": "1.0",
    "name": "quiz",
    "description": "A multiple-choice quiz with the correct answer marked.",
    "tags": [
        "items"
    ],
    "plugins": [
        "../../plugin"
    ],
    "context": {
        "scaffold_script": "scaffold.sh"
    },
    "execution": {
        "prompt": "Add a multiple-choice quiz overlay to the lecture at 4:10 for 20 seconds asking whether osmosis needs energy, with the answers Yes and No; No is correct.",
        "max_turns": 30,
        "timeout_seconds": 600,
        "allowed_tools": [
            "Read",
            "Glob",
            "Grep",
            "Edit",
            "Write",
            "Bash",
            "Skill"
        ]
    },
    "runs": 2,
    "graders": [
        {
            "type": "tool_used",
            "name": "skill-fired",
            "tool": "Skill",
            "input_match": "frametrail-hypervideo",
            "arm": "with-only"
        }
    ]
}
