{
    "schema_version": "1.0",
    "name": "chapters",
    "description": "Two named chapters: one is added, the other is after the end of the 10-minute video, so it is left out and the user is told why.",
    "tags": [
        "core",
        "chapters"
    ],
    "plugins": [
        "../../plugin"
    ],
    "context": {
        "scaffold_script": "scaffold.sh"
    },
    "execution": {
        "prompt": "Add two chapters to the lecture: \"Summary\" at 8:30 and \"Bonus\" at 15:00.",
        "max_turns": 30,
        "timeout_seconds": 600,
        "allowed_tools": [
            "Read",
            "Glob",
            "Grep",
            "Edit",
            "Write",
            "Bash",
            "Skill"
        ]
    },
    "runs": 2,
    "graders": [
        {
            "type": "tool_used",
            "name": "skill-fired",
            "tool": "Skill",
            "input_match": "frametrail-hypervideo",
            "arm": "with-only"
        }
    ]
}
