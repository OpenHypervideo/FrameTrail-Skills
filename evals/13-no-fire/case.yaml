{
    "schema_version": "1.0",
    "name": "no-fire",
    "description": "A request that has nothing to do with FrameTrail: the skill stays out of it.",
    "tags": [
        "neg"
    ],
    "plugins": [
        "../../plugin"
    ],
    "context": {
        "scaffold_script": "scaffold.sh"
    },
    "execution": {
        "prompt": "Add a \"test\" script to package.json that runs node --test.",
        "max_turns": 30,
        "timeout_seconds": 600,
        "allowed_tools": [
            "Read",
            "Glob",
            "Grep",
            "Edit",
            "Write",
            "Bash",
            "Skill"
        ]
    },
    "runs": 2,
    "graders": [
        {
            "type": "tool_used",
            "name": "skill-not-fired",
            "tool": "Skill",
            "input_match": "frametrail-hypervideo",
            "min": 0,
            "max": 0,
            "arm": "both"
        }
    ]
}
