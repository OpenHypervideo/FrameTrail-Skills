{
    "schema_version": "1.0",
    "name": "subtitles-and-transcript",
    "description": "Subtitles in another language from given cues (a WebVTT file and its entry), and a content view added to an area, after the one there.",
    "tags": [
        "items"
    ],
    "plugins": [
        "../../plugin"
    ],
    "context": {
        "scaffold_script": "scaffold.sh"
    },
    "execution": {
        "prompt": "Add German subtitles to the lecture with these two cues: 0:01 to 0:06 \"Willkommen zur dritten Vorlesung über Zellbiologie.\" and 0:06 to 0:12.5 \"Heute geht es um Membranen und Transport.\" Also show the transcript in the area below the video, after the notes.",
        "max_turns": 30,
        "timeout_seconds": 600,
        "allowed_tools": [
            "Read",
            "Glob",
            "Grep",
            "Edit",
            "Write",
            "Bash",
            "Skill"
        ]
    },
    "runs": 2,
    "graders": [
        {
            "type": "tool_used",
            "name": "skill-fired",
            "tool": "Skill",
            "input_match": "frametrail-hypervideo",
            "arm": "with-only"
        }
    ]
}
