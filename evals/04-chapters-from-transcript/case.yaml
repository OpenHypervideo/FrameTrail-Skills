{
    "schema_version": "1.0",
    "name": "chapters-from-transcript",
    "description": "Chapters at the topic changes the transcript shows.",
    "tags": [
        "chapters"
    ],
    "plugins": [
        "../../plugin"
    ],
    "context": {
        "scaffold_script": "scaffold.sh"
    },
    "execution": {
        "prompt": "Add a chapter to the lecture at each topic change in the first 5 minutes.",
        "max_turns": 30,
        "timeout_seconds": 600,
        "allowed_tools": [
            "Read",
            "Glob",
            "Grep",
            "Edit",
            "Write",
            "Bash",
            "Skill"
        ]
    },
    "runs": 2,
    "graders": [
        {
            "type": "tool_used",
            "name": "skill-fired",
            "tool": "Skill",
            "input_match": "frametrail-hypervideo",
            "arm": "with-only"
        }
    ]
}
